[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
aes = "0.9"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
bytes = "1.12"
cbc = "0.2"
clap = { version = "4.6", features = ["derive"] }
compio = { version = "0.19", default-features = false, features = ["io-uring", "polling", "macros", "net", "signal", "time", "tls", "rustls", "ring"] }
compio-quic = { version = "0.8.2", default-features = false, features = ["h3", "ring"] }
compio-tls = { version = "0.10", default-features = false, features = ["rustls", "ring"] }
des = "0.9"
divan = "0.1.21"
futures-rustls = { version = "0.26", default-features = false, features = ["ring"] }
futures-channel = "0.3"
futures-util = "0.3"
hcl-rs = "0.19"
http-body-util = "0.1"
hyper = { version = "1.12", default-features = false, features = ["client", "http1", "server"] }
ipnet = "2.12"
lru = "0.18"
libc = "0.2"
md-5 = "0.11"
opentelemetry = "0.33"
opentelemetry-http = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace"] }
opentelemetry_sdk = "0.33"
pem = "4"
pkcs8 = { version = "0.11", features = ["encryption", "pem"] }
prometheus-client = "0.25"
rcgen = { version = "0.14", features = ["x509-parser"] }
send_wrapper = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
sec1 = "0.8"
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
