[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
aes = "0.8"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.10"
cbc = "0.1"
clap = { version = "4.5", features = ["derive"] }
compio = { version = "0.19", default-features = false, features = ["io-uring", "polling", "macros", "net", "signal", "time", "tls", "rustls", "ring"] }
compio-quic = { version = "0.8.2", default-features = false, features = ["h3", "ring"] }
compio-tls = { version = "0.10", default-features = false, features = ["rustls", "ring"] }
cyper-core = "0.9"
des = "0.8"
divan = "0.1.21"
futures-rustls = { version = "0.26", default-features = false, features = ["ring"] }
futures-util = "0.3"
hcl-rs = "0.19"
http-body-util = "0.1"
hyper = { version = "1.6", default-features = false, features = ["client", "http1", "server"] }
ipnet = "2.11"
lru = "0.12"
libc = "0.2"
md-5 = "0.10"
opentelemetry = "0.29"
opentelemetry-http = "0.29"
opentelemetry-otlp = { version = "0.29", default-features = false, features = ["http-proto", "trace"] }
opentelemetry_sdk = "0.29"
pem = "3"
pkcs8 = { version = "0.10", features = ["encryption", "pem"] }
prometheus-client = "0.23"
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
sec1 = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1"
tracing-opentelemetry = "0.30"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
