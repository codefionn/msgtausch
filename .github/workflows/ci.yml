name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DOCKER_BUILDKIT: 1

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets

  simulation:
    name: Proxy simulation corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          targets: simulation
          set: |
            simulation.cache-from=type=gha
            simulation.cache-to=type=gha,mode=max

  throughput:
    name: Native throughput check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          targets: throughput
          set: |
            throughput.cache-from=type=gha
            throughput.cache-to=type=gha,mode=max

  compose:
    name: Proxy integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - run: cd tests/compose-intercept && docker compose build
      - run: cd tests/compose-intercept && timeout --signal=SIGINT 300 docker compose up --abort-on-container-exit --exit-code-from client
      - if: always()
        run: cd tests/compose-intercept && docker compose down -v --remove-orphans

  nix:
    name: Nix build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build .#msgtausch
      - run: result/bin/msgtausch --help

  containers:
    name: Multi-architecture container archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [rust, simulation, compose, throughput]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          targets: image
          set: |
            image.target=runtime-release
            image.cache-from=type=gha
            image.cache-to=type=gha,mode=max

  publish-main:
    name: Publish main proxy image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: default
    needs: containers
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: quay.io/codefionn/msgtausch
          tags: type=raw,value=main
      - uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-tags }}
            ${{ steps.meta.outputs.bake-file-labels }}
          targets: release
          set: |
            release.target=runtime-release
            release.args.VERSION=main
            release.cache-from=type=gha
            release.cache-to=type=gha,mode=max

  release:
    name: Release containers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: default
    needs: [containers, nix]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            codefionn/msgtausch
            quay.io/codefionn/msgtausch
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-tags }}
            ${{ steps.meta.outputs.bake-file-labels }}
          targets: release
          set: |
            release.target=runtime-release
            release.args.VERSION=${{ github.ref_name }}
            release.cache-from=type=gha
            release.cache-to=type=gha,mode=max
