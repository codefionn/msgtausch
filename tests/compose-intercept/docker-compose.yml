# End-to-end interception tests using containers.
# Prefers podman compose/podman-compose, but also compatible with docker compose.

services:
  proxy:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime-release
    image: msgtausch:test
    command: ["--config", "/config/config.json", "--debug"]
    volumes:
      - ./proxy-config.json:/config/config.json:ro
      - ./ca:/ca:ro
    ports:
      - "8080:8080"
    networks:
      - msgtausch-intercept-test

  http-backend:
    build:
      context: .
      dockerfile_inline: |
        FROM docker.io/library/python:3.13-alpine
        RUN apk add --no-cache wget ca-certificates \
            && adduser -D -H app
        WORKDIR /app
        USER app
        COPY backend/server.py /app/server.py
        COPY ca /ca
        ENV PORT=5678
        ENV TLS=false
        EXPOSE 5678 8443
        ENTRYPOINT ["python3", "/app/server.py"]
    image: msgtausch-test-backend:local
    environment:
      - PORT=5678
      - TLS=false
      - SSL_CERT_FILE=/ca/test_ca.crt
    expose:
      - "5678"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/ | grep -q hello-http"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
    networks:
      - msgtausch-intercept-test

  https-backend:
    build:
      context: .
      dockerfile_inline: |
        FROM docker.io/library/python:3.13-alpine
        RUN apk add --no-cache wget ca-certificates \
            && adduser -D -H app
        WORKDIR /app
        USER app
        COPY backend/server.py /app/server.py
        COPY ca /ca
        ENV PORT=8443
        ENV TLS=true
        EXPOSE 5678 8443
        ENTRYPOINT ["python3", "/app/server.py"]
    image: msgtausch-test-backend-https:local
    environment:
      - PORT=8443
      - TLS=true
      - SSL_CERT_FILE=/ca/test_ca.crt
      - CA_CERT_FILE=/ca/test_ca.crt
      - CA_KEY_FILE=/ca/test_ca.key
    expose:
      - "8443"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- https://127.0.0.1:8443/ | grep -q hello-https",
        ]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 1s
    networks:
      - msgtausch-intercept-test

  client:
    build:
      context: .
      dockerfile_inline: |
        FROM docker.io/curlimages/curl:8.8.0
        COPY client/test.sh /test.sh
        COPY ca /ca
        ENTRYPOINT ["sh", "/test.sh"]
    image: msgtausch-test-client:local
    depends_on:
      proxy:
        condition: service_started
      http-backend:
        condition: service_healthy
      https-backend:
        condition: service_healthy
    environment:
      - HTTP_PROXY=http://proxy:8080
      - HTTPS_PROXY=http://proxy:8080
      - NO_PROXY=localhost,127.0.0.1
      - SSL_CERT_FILE=/ca/test_ca.crt
    networks:
      - msgtausch-intercept-test

networks:
  msgtausch-intercept-test:
    name: msgtausch-intercept-test
    external: false
